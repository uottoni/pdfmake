version: '3.8'

services:
  dev-playground:
    build:
      context: ..
      dockerfile: dev-playground/Dockerfile
    ports:
      - "1234:1234"
    volumes:
      - ../dev-playground/public:/app/dev-playground/public
      - ../dev-playground/server.js:/app/dev-playground/server.js
    environment:
      - PORT=1234
    restart: unless-stopped
